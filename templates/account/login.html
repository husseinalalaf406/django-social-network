{% extends "account/base.html" %}

{% load i18n allauth account %}

{% block title %}
    Login
{% endblock %}

{% block account_content %}

<h2>{% trans "Sign In" %}</h2>

<form method="post" action="{% url 'account_login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% trans "Sign In" %}</button>
</form>

{% endblock %}
