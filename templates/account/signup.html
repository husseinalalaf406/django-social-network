{% extends "account/base.html" %}

{% load allauth account %}

{% block title %}
    Sign Up
{% endblock %}

{% block account_content %}

<h2>Create Account</h2>

<form method="post" action="{% url 'account_signup' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign Up</button>
</form>

{% endblock %}
