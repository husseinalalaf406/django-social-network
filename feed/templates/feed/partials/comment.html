<div
    id="comment-{{ comment.id }}"
    class="comment-item flex items-start gap-2.5"
>

  <!-- Single Avatar with initial badge overlay -->
  <a href="{% url 'profiles:detail' username=comment.user.username %}" class="relative shrink-0 block">
    <img
        src="{{ comment.user.profile.avatar.url }}"
        class="w-9 h-9 sm:w-10 sm:h-10
               shrink-0
               rounded-full object-cover
               border border-gray-200/80 shadow-xs"
    />
  </a>

  <!-- Comment body -->
  <div class="flex flex-col gap-1">
    <div class="bg-gray-100 dark:bg-secondary/70 rounded-2xl px-4 py-2.5">
      <a href="{% url 'profiles:detail' username=comment.user.username %}"
         class="text-sm font-semibold text-gray-900 hover:underline">
        {{ comment.user.username }}
      </a>
      <p class="text-sm text-gray-800 dark:text-gray-100">{{ comment.text }}</p>
    </div>
    <div class="flex items-center gap-3 pl-1 text-xs text-gray-500">
      <span>{{ comment.date|date:"M d, Y g:i A" }}</span>
      <button class="font-medium hover:text-danger transition-colors">Like</button>
      <button class="font-medium text-primary hover:text-secondary transition-colors">Reply</button>
    </div>
  </div>
</div>
