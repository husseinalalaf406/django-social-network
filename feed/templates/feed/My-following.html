{% extends "base.html" %}
{% block title %}
    Feed | Social Network
{% endblock %}
{% block content %}
{% if posts %}
    {% include "feed/includes/post.html" with post=post %}
{% else %}
<div class="text-center py-10 sm:py-12 px-4">

    <!-- Icon -->
    <div
        class="w-14 h-14 sm:w-16 sm:h-16
               mx-auto mb-4
               rounded-full
               bg-indigo-50
               text-indigo-600
               flex items-center justify-center"
    >
        <svg
            class="w-7 h-7 sm:w-8 sm:h-8"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="1.8"
        >
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"
            />
            <circle
                cx="9"
                cy="7"
                r="4"
            />

            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M19 8v6m3-3h-6"
            />
        </svg>
    </div>


    <!-- Heading -->
    <h2
        class="text-lg sm:text-xl
               font-bold
               text-gray-900"
    >
        You don't follow anyone yet
    </h2>


    <!-- Description -->
    <p
        class="text-sm sm:text-base
               text-gray-500
               mt-2
               max-w-md
               mx-auto
               leading-relaxed"
    >
        Try following some people to see their posts here.
    </p>

</div>
{% endif %}
{% endblock %}
